buildscript {
    repositories {
        mavenCentral()
        maven {
           url = 'https://repo.grails.org/grails/restricted'
        }
    }
    dependencies { // Not Published to Gradle Plugin Portal
        classpath platform("org.apache.grails:grails-bom:$grailsVersion")
        classpath "org.apache.grails:grails-gradle-plugins"
    }
}

plugins {
    id "java-library"
    id "idea"
    id "eclipse"
    id "maven-publish"
    id "com.vanniktech.maven.publish" version "0.36.0"
}

// Not Published to Gradle Plugin Portal
apply plugin: "org.apache.grails.gradle.grails-plugin"
// Grails 8 keeps application commands out of the runtime: generate-openapi ships in the companion
// grails-openapi-cli artifact, which applications provision into their grailsCli classpath.
apply plugin: "org.apache.grails.gradle.grails-plugin-cli"

group = "io.github.gustavoharff"

repositories {
    mavenCentral()
    maven {
       url = 'https://repo.grails.org/grails/restricted'
    }
}

configurations {
    javaCompileOnly
}

dependencies {
    profile "org.apache.grails.profiles:web-plugin"
    javaCompileOnly gradleApi()
    implementation platform("org.apache.grails:grails-bom:$grailsVersion")
    implementation "org.apache.grails:grails-core"
    implementation "org.apache.grails:grails-url-mappings"
    implementation "org.apache.grails:grails-logging"
    implementation "org.yaml:snakeyaml"
    implementation "org.springframework.boot:spring-boot-autoconfigure"
    implementation "org.springframework.boot:spring-boot-starter-logging"
    console "org.apache.grails:grails-console"
    testImplementation "org.spockframework:spock-core"
    // Gradle 9 no longer puts the JUnit Platform launcher on the test classpath by itself
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "net.bytebuddy:byte-buddy"
    testImplementation "org.objenesis:objenesis"
    testImplementation "org.jetbrains.kotlin:kotlin-stdlib:2.2.0"
    testImplementation "org.jetbrains.kotlin:kotlin-reflect:2.2.0"
    testImplementation "org.jetbrains:annotations:26.0.2"
}

compileJava {
    classpath += configurations.javaCompileOnly
    options.release = 21
}

javadoc {
    classpath += configurations.javaCompileOnly
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}



// Maven Central rejects a jar published without sources and javadoc, and the cli feature the
// Grails plugin registers comes without either.
def cliSourcesJar = tasks.register('cliSourcesJar', Jar) {
    archiveBaseName = 'grails-openapi-cli'
    archiveClassifier = 'sources'
    from sourceSets.cli.allSource
}

def cliJavadocJar = tasks.register('cliJavadocJar', Jar) {
    archiveBaseName = 'grails-openapi-cli'
    archiveClassifier = 'javadoc'
    from tasks.named('cliJavadoc')
}

publishing {
    publications {
        cli(MavenPublication) {
            from components.cli
            artifact cliSourcesJar
            artifact cliJavadocJar
            artifactId = 'grails-openapi-cli'
            // The companion depends on the plugin itself; as an alias, this publication leaves
            // that project dependency to resolve to the plugin's own coordinate.
            alias = true
        }
    }
}

mavenPublishing {
    // No coordinates(...) here: it forces one artifactId on every publication, which would
    // publish the cli companion over the plugin itself. Group, version and the project name
    // (settings.gradle) already give both their coordinates.

    publishToMavenCentral()

    signAllPublications()

    pom {
        name = "Grails OpenAPI Plugin"
        description = "OpenAPI specification generator for Grails applications"
        url = "https://github.com/gustavoharff/grails-openapi"
        inceptionYear = "2025"

        licenses {
            license {
                name = "The Apache License, Version 2.0"
                url = "https://www.apache.org/licenses/LICENSE-2.0.txt"
            }
        }

        developers {
            developer {
                id = "gustavoharff"
                name = "Gustavo Harff"
            }
        }

        scm {
            connection = "scm:git:git://github.com/gustavoharff/grails-openapi.git"
            developerConnection = "scm:git:ssh://github.com/gustavoharff/grails-openapi.git"
            url = "https://github.com/gustavoharff/grails-openapi"
        }

    }
}
